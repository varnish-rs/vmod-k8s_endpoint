[package]
name = "vmod_k8s_endpoint"
version = "0.1.0"
edition = "2021"
description = "Varnish VMOD: Kubernetes endpoint discovery director"
authors = ["Guillaume Quintard <guillaume.quintard@varnish-software.com>"]
repository = "https://github.com/varnish/vmod-k8s_endpoint"
license = "MIT"
rust-version = "1.90"

[dependencies]
kube = { version = "0.96", features = ["runtime", "client"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
k8s-openapi = { version = "0.23", features = ["v1_31"] }
http = "1"
varnish = { version = "0.7.0", features = ["ffi"] }
rand = "0.9"
indexmap = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(varnishsys_90_sslflags)'] }

[lib]
crate-type = ["cdylib"]
